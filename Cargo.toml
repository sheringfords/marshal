[package]
name = "marshall"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Marshall — sandboxed tool execution for agents: filesystem, shell, HTTP, code, and system behind deny-by-default policies with SSRF protection."
repository = "https://github.com/rapture-fx/Marshall"
readme = "README.md"
keywords = ["agent", "sandbox", "ssrf", "tools", "security"]
categories = ["development-tools", "web-programming"]
# The validation harness is a research artifact, not part of the crate. Keeping
# it out of the package keeps the published tarball to the library and service.
exclude = [
    "validation/",
    "audit.jsonl",
    "ROADMAP.md",
    ".github/",
    "fuzz/",
]

# Binaries are declared explicitly rather than auto-discovered, so the research
# tooling can sit behind a feature instead of building for every user.
autobins = false

[lib]
name = "marshall"
path = "src/lib.rs"

[features]
default = []
# The validation harness: an experiment recorder, trace analyzer, and the
# runners used to produce `validation/`. It is a research artifact rather than
# part of the product, and nothing in the library depends on it, so it is off by
# default and out of the published API surface.
experiment = []
wasm = ["dep:wasmtime"]
backend-wasm = ["wasm"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "process", "fs", "io-util", "sync", "time", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
base64 = "0.22"
wasmtime = { version = "22", optional = true }
axum = { version = "0.7", features = ["json", "query"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-stream = "0.1"
serde_yaml = "0.9"
notify = "6.1"
rustix = { version = "0.38", features = ["fs", "process"] }
glob = "0.3"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"] }
wat = "1.0"

[[bin]]
name = "marshalld"
path = "src/bin/marshalld.rs"

[[bin]]
name = "fuzz_destination"
path = "fuzz/fuzz_destination.rs"

[[bin]]
name = "validation-analyzer"
path = "src/bin/validation_analyzer.rs"
required-features = ["experiment"]

[[bin]]
name = "baseline_runner"
path = "src/bin/baseline_runner.rs"
required-features = ["experiment"]

[[bin]]
name = "treatment_runner"
path = "src/bin/treatment_runner.rs"
required-features = ["experiment"]

[[bin]]
name = "generate_reports"
path = "src/bin/generate_reports.rs"
required-features = ["experiment"]

[[bin]]
name = "phase2_comparison"
path = "src/bin/phase2_comparison.rs"
required-features = ["experiment"]

[[bin]]
name = "mcp_verify_change"
path = "src/bin/mcp_verify_change.rs"
required-features = ["experiment"]

[[bin]]
name = "mcp_bounded_sequence"
path = "src/bin/mcp_bounded_sequence.rs"

[[test]]
name = "validation"
path = "tests/validation.rs"
required-features = ["experiment"]
